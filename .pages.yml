content:
  - name: java
    label: Java
    type: collection
    path: docs/Java
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: true
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      layout: tree
      node:
        filename: index.md
        hideDirs: others
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
